<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2D231E" />
      <stop offset="100%" stop-color="#120D0B" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" />

  <!-- Two Hearts Cafe Monogram & Hearts -->
  <g transform="translate(256, 230) scale(1.15)">
    <!-- First Heart (Left) -->
    <path d="M -30 -60 C -90 -120 -150 -40 -100 30 L 0 130 L 100 30 C 150 -40 90 -120 30 -60 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#glow)" transform="translate(-25, -15) rotate(-12) scale(0.72)" />

    <!-- Second Heart (Right, Interlocking) -->
    <path d="M -30 -60 C -90 -120 -150 -40 -100 30 L 0 130 L 100 30 C 150 -40 90 -120 30 -60 Z"
          fill="none" stroke="#FDE68A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
          opacity="0.9" transform="translate(25, -5) rotate(14) scale(0.68)" />

    <!-- Center Coffee Steam / Sparkle -->
    <circle cx="0" cy="-6" r="8" fill="#FDE68A" />
  </g>

  <!-- Text: TWO HEARTS CAFE -->
  <text x="256" y="405" font-family="'Playfair Display', serif, Georgia" font-size="34" font-weight="700"
        letter-spacing="5" fill="#FDE68A" text-anchor="middle">
    TWO HEARTS
  </text>
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="600"
        letter-spacing="10" fill="#B45309" text-anchor="middle">
    CAFE &amp; BISTRO
  </text>
</svg>
